name: AVG Plus Android Pages

on:
  workflow_dispatch:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - .github/workflows/avg-plus-pages.yml
      - builds/android/pages.py
      - builds/android/delta.py

permissions:
  contents: read

concurrency:
  group: avg-plus-pages
  cancel-in-progress: false

jobs:
  dispatch-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Deploy through the protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avg-plus-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify release assets and assemble the resource site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B builds/android/pages.py --repository "$GITHUB_REPOSITORY" --destination "$RUNNER_TEMP/avg-plus-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/avg-plus-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
