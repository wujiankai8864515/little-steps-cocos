name: AVG Plus Android Pages

on:
  workflow_dispatch:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - .github/workflows/avg-plus-pages.yml
      - builds/android/pages.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: avg-plus-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify release assets and assemble the resource site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B builds/android/pages.py --repository "$GITHUB_REPOSITORY" --destination "$RUNNER_TEMP/avg-plus-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/avg-plus-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
